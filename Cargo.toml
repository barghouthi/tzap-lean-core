[package]
# Published to crates.io as "tzap-opt" ("tzap" was already taken by an
# unrelated project) — the lib/bin names below keep everything else (the
# `tzap` binary, `use tzap::...` throughout this crate) unchanged.
name = "tzap-opt"
version = "0.3.1"
edition = "2024"
description = "A super fast, Rust-based optimizer for large Clifford+T circuits"
license = "Apache-2.0"
authors = ["Aws Albarghouthi"]
repository = "https://github.com/qqq-wisc/tzap"
homepage = "https://github.com/qqq-wisc/tzap"
keywords = ["quantum", "circuit", "optimization", "qasm", "clifford"]
categories = ["science", "command-line-utilities"]
readme = "README.md"

[lib]
name = "tzap"

[[bin]]
name = "tzap"
path = "src/main.rs"

[dependencies]
rayon = "1"
rsgridsynth = "0.2"
rustc-hash = "2"
smallvec = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
