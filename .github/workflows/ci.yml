name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # uv runs tests/qcec_check.py (QCEC equivalence checking) from the
      # ignored test suite; caching keeps the mqt.qcec wheels warm.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cargo test
      - run: cargo test --release -- --ignored

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qiskit: "qiskit==1.0.*"
            pennylane: "pennylane==0.40.*"
            autoray: "autoray<0.8"
          - qiskit: "qiskit>=2"
            pennylane: "pennylane>=0.45"
            autoray: "autoray>=0.8"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test Python and Qiskit bindings
        run: |
          uv venv
          uv pip install -e . "pytest>=7" \
            "${{ matrix.qiskit }}" "${{ matrix.pennylane }}" \
            "${{ matrix.autoray }}"
          uv run --no-sync pytest tests/python
