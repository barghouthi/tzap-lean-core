name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # uv runs tests/qcec_check.py (QCEC equivalence checking) from the
      # ignored test suite; caching keeps the mqt.qcec wheels warm.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cargo test
      - run: cargo test --release -- --ignored
