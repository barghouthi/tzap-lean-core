[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tzap"
description = "A super fast, Rust-based optimizer for large Clifford+T circuits"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Aws Albarghouthi" }]
requires-python = ">=3.8"
keywords = ["quantum", "circuit", "optimization", "qasm", "clifford"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dynamic = ["version"]

[project.optional-dependencies]
pennylane = ["pennylane>=0.40"]
qiskit = ["qiskit>=1.0"]
test = [
    "pennylane>=0.40",
    "pytest>=7",
    "qiskit>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.16.0"]

[project.scripts]
tzap = "tzap._cli:main"

[project.urls]
Repository = "https://github.com/qqq-wisc/tzap"
Homepage = "https://github.com/qqq-wisc/tzap"

[tool.maturin]
bindings = "pyo3"
features = ["python", "pyo3/extension-module"]
module-name = "tzap._native"
python-source = "python"
strip = true

[tool.uv]
# PennyLane >=0.40 requires Python >=3.10; the core package remains Python >=3.8.
environments = ["python_version >= '3.10'"]
